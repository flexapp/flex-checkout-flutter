name: flex-checkout-flutter / Sauce tests

# Builds the centralized host app (sdk-test-automation :: example-apps/flutter-default, both
# platforms) against this PR's plugin source. On an ordinary feature PR this is BUILD-ONLY — no
# Sauce upload, no dispatch, no paid device time — it just proves the PR's plugin source still
# compiles into the host app (catches consumer-breaking API/packaging changes). The full suite
# (upload + centralized Appium run) is reserved for the version-bump PR, which routes through
# release-gate.yml instead — see detect-version-bump.yml.
#
# Escape hatch: a manual workflow_dispatch on THIS workflow still runs the full build + upload +
# dispatch, exactly as before, so a risky feature PR can be opted into full Sauce coverage by hand.
#
# The build is a cross-repo call into sdk-test-automation's build-flutter-{android,ios}-default.yml
# rather than a local reimplementation, so the two copies can't drift apart. Reusable-workflow
# calls must be job-level `uses:`, so each platform is its own job, with dispatch/comment logic in
# a separate downstream job.
#
# sdk_version here is a git ref of THIS repo (the build workflows rewrite the host app's pubspec
# git dependency to it), so the PR head SHA builds the host app against exactly this PR's plugin
# code — including its pinned native SDK versions. No auth token is needed for this build
# regardless of do_upload — flex-checkout-flutter is a public repo.
#
# Prereqs for the escape-hatch / version-bump upload path: sdk-test-automation allows org
# reusable-workflow access, and the Flex CI GitHub App (FLEX_GH_APP_ID/KEY) is INSTALLED ON THIS
# REPO with Commit statuses: write and Issues/Pull requests: write — the central receivers post
# results back through it.
#
# Credentials forwarded via `secrets: inherit`: FLEX_CLIENT_ID_DEFAULT, FLEX_API_KEY_DEFAULT,
# SAUCE_USERNAME, SAUCE_ACCESS_KEY, FLEX_GH_APP_ID, FLEX_GH_APP_KEY.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-version-bump:
    uses: ./.github/workflows/detect-version-bump.yml

  # Skip a version-bump PR — release-gate.yml handles those instead (full suite, blocking), so
  # neither path dispatches twice against the org's 2-session Sauce ceiling. A failed
  # detect-version-bump already skips this job (default "skip on failed needs"); build-gate below
  # surfaces that failure loudly instead of leaving it silent.
  build-android:
    name: Build Android host app (vs PR plugin source)
    needs: detect-version-bump
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-version-bump.outputs.version_bumped == 'false' }}
    concurrency:
      group: sauce-flutter-android-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    uses: flexapp/sdk-test-automation/.github/workflows/build-flutter-android-default.yml@main
    with:
      sdk_version: ${{ github.event.pull_request.head.sha || github.sha }}
      do_upload: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  build-ios:
    name: Build iOS host app (vs PR plugin source)
    needs: detect-version-bump
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-version-bump.outputs.version_bumped == 'false' }}
    concurrency:
      group: sauce-flutter-ios-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    uses: flexapp/sdk-test-automation/.github/workflows/build-flutter-ios-default.yml@main
    with:
      sdk_version: ${{ github.event.pull_request.head.sha || github.sha }}
      do_upload: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  # Reports build health on the everyday (build-only) path, where `dispatch` below doesn't run at
  # all. Runs under bare always() so it never silently skips, and is therefore the one honest
  # required-check candidate in this file.
  build-gate:
    name: Host app builds (build-only)
    needs: [detect-version-bump, build-android, build-ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky PR comment when the build itself breaks
    steps:
      - name: Fail loudly — version-bump detection itself failed
        id: detect-check
        if: ${{ needs.detect-version-bump.result == 'failure' }}
        run: |
          echo "::error::detect-version-bump failed, so we can't tell whether release-gate.yml covers this PR instead. Failing loudly rather than silently skipping."
          exit 1

      # NOTE: '== failure', not '!= success' — on the version-bump path build-android/build-ios
      # are SKIPPED (their own `if:` above excludes it), and release-gate.yml owns testing there.
      # `!= 'success'` would incorrectly red-flag every release PR here.
      - name: Fail if either host-app build broke (feature-PR build-only path)
        id: build-check
        if: >-
          ${{ needs.detect-version-bump.result == 'success' &&
              github.event_name != 'workflow_dispatch' &&
              needs.detect-version-bump.outputs.version_bumped == 'false' &&
              (needs.build-android.result == 'failure' || needs.build-ios.result == 'failure') }}
        run: |
          echo "::error::build-android=${{ needs.build-android.result }} build-ios=${{ needs.build-ios.result }} — this PR breaks the centralized host app (consumer-visible API/packaging change)."
          exit 1

      # Two comment variants, gated on which check above actually fired (only one ever runs) —
      # a detect-version-bump infra failure is not a compile failure, and the comment shouldn't
      # claim otherwise.
      - name: Comment on PR — host app build broke
        if: ${{ steps.build-check.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sauce-buildgate
          message: |
            ❌ **This PR's plugin source no longer compiles into the centralized host app.**

            See the failed `build-android` / `build-ios` job above for the specific error. This is a
            build/packaging failure caught on a feature PR — the full Appium suite only runs on the
            version-bump (release) PR via `release-gate.yml`, or on a manual `workflow_dispatch` of
            this workflow.

      - name: Comment on PR — build-only pipeline failed before it could report
        if: ${{ steps.detect-check.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sauce-buildgate
          message: |
            ❌ **The build-only check failed before it could tell whether this PR's plugin source compiles.**

            `detect-version-bump` (which decides whether `release-gate.yml` should own this PR
            instead) itself failed — see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the specific error. This is an infra failure, not a build/compile failure.

      - name: Clear stale failure comment on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sauce-buildgate
          delete: true

  # Full suite path only: manual workflow_dispatch (escape hatch), or detection itself failed.
  # An ordinary feature PR never enters this job — build-gate above covers it instead.
  dispatch:
    name: Dispatch centralized tests
    needs: [detect-version-bump, build-android, build-ios]
    if: ${{ always() && (needs.detect-version-bump.result == 'failure' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky PR comment when the build/dispatch fails before tests run
    steps:
      - name: Fail loudly — version-bump detection itself failed
        if: ${{ needs.detect-version-bump.result == 'failure' }}
        run: |
          echo "::error::detect-version-bump failed, so we can't tell whether this PR bumps the SDK version (and therefore whether release-gate.yml already covers it). Failing loudly rather than silently skipping Sauce testing for this PR."
          exit 1

      - name: Fail loudly if either build job didn't succeed
        if: ${{ needs.detect-version-bump.result == 'success' && (needs.build-android.result != 'success' || needs.build-ios.result != 'success') }}
        run: |
          echo "::error::build-android=${{ needs.build-android.result }} build-ios=${{ needs.build-ios.result }} — at least one host-app build failed, so its suite was never dispatched."
          exit 1

      - name: Mint GitHub App token (dispatch on sdk-test-automation)
        id: app-token
        timeout-minutes: 5
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FLEX_GH_APP_ID }}
          private-key: ${{ secrets.FLEX_GH_APP_KEY }}
          owner: flexapp
          repositories: sdk-test-automation

      - name: Dispatch centralized flutter-android tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SAUCE_APP_ID: ${{ needs.build-android.outputs.sauce_file_id }}
          SOURCE_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -n --arg app "$SAUCE_APP_ID" --arg repo "$SOURCE_REPO" --arg sha "$SHA" --arg pr "$PR_NUMBER" \
            '{event_type: "flutter-android-tests", client_payload: {sauce_app_id: $app, source_repo: $repo, sha: $sha, pr_number: $pr}}' \
            | gh api -X POST repos/flexapp/sdk-test-automation/dispatches --input -
          echo "Dispatched flutter-android-tests for $SOURCE_REPO@$SHA (Sauce app $SAUCE_APP_ID)"

      - name: Dispatch centralized flutter-ios tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SAUCE_APP_ID: ${{ needs.build-ios.outputs.sauce_file_id }}
          SOURCE_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -n --arg app "$SAUCE_APP_ID" --arg repo "$SOURCE_REPO" --arg sha "$SHA" --arg pr "$PR_NUMBER" \
            '{event_type: "flutter-ios-tests", client_payload: {sauce_app_id: $app, source_repo: $repo, sha: $sha, pr_number: $pr}}' \
            | gh api -X POST repos/flexapp/sdk-test-automation/dispatches --input -
          echo "Dispatched flutter-ios-tests for $SOURCE_REPO@$SHA (Sauce app $SAUCE_APP_ID)"

      # Test results come back as commit statuses from the central receivers, posted separately.
      - name: Comment on PR — pipeline failed before tests ran
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sauce-pipeline
          message: |
            ❌ **Sauce pipeline failed before finishing both dispatches.**

            This job failed before dispatching one or both of the centralized `flutter-android` / `flutter-ios` suites — either during a host-app build (`build-android`/`build-ios` jobs above), or while minting the dispatch token / firing the dispatch itself. This is an infra/build failure, not a test failure — see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the specific step and error. **Check the `sdk-test-automation / flutter-android (Sauce)` and `sdk-test-automation / flutter-ios (Sauce)` commit statuses on this PR** — whichever already shows a result got out before this failure hit.

            _When this job succeeds, test results post separately as those same commit statuses on this PR._

      - name: Clear stale failure comment on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sauce-pipeline
          delete: true

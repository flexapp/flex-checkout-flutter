name: Host app builds (build-only)

# Proves this PR's plugin source still compiles into a consumer app on both platforms. It builds a
# throwaway app generated by .github/scripts/create-host-app.sh, so it needs no credentials and
# nothing from any private repo. The full Appium/Sauce suite runs from flexapp/sdk-test-automation
# instead — see release-gate.yml.
#
# merge_group: lets the "Host app builds (build-only)" check be required without blocking a merge
# queue (a required check with no check-run for the queue's synthetic ref waits forever).
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android host app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Generate host app
        run: .github/scripts/create-host-app.sh "$RUNNER_TEMP/host"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/host
        run: flutter build apk --debug

  ios:
    name: Build iOS host app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Generate host app
        run: .github/scripts/create-host-app.sh "$RUNNER_TEMP/host"

      - name: Build iOS app (no codesign)
        working-directory: ${{ runner.temp }}/host
        run: flutter build ios --debug --no-codesign

  # Single required-check candidate. Runs under always() so a cancelled or skipped build still
  # fails it instead of reporting green.
  build-gate:
    name: Host app builds (build-only)
    needs: [android, ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless both builds succeeded
        if: ${{ needs.android.result != 'success' || needs.ios.result != 'success' }}
        run: |
          echo "::error::android=${{ needs.android.result }} ios=${{ needs.ios.result }} — this PR's plugin source does not compile into a consumer app."
          exit 1
